# One command: docker compose up --build   ->  http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evidence_db
    ports: ["3306:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-proot"], interval: 5s, retries: 20 }
  app:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: root
      REDIS_HOST: redis
      UPLOAD_DIR: /data/uploads
    volumes: ["evidence_files:/data/uploads"]
    ports: ["8080:8080"]
volumes:
  evidence_files:
