server.port=8080
spring.application.name=digital-evidence-system

# ---- Database (default: H2 file DB -> zero setup). For MySQL run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/evidencedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---- Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.ttl-seconds=600

# ---- JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=120

# ---- File storage
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
